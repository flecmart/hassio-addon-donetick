# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config

name: Donetick
version: "1.1.45"
slug: donetick
description: Simplify Tasks & Chores, Together.
url: "https://github.com/Donetick/hassio-addons/tree/main/donetick"
arch:
  - armv7
  - aarch64
  - amd64
init: false
map:
  - type: data
    read_only: False
    path: /data
environment:
  DT_SQLITE_PATH: /data/donetick.db
  DT_ENV: selfhosted
# TODO: disabled for local testing in devcontainer -> if this ever gets merged this has to be reverted
#image: "ghcr.io/donetick/{arch}-hassio-addons"

ingress: true

options:
  jwt_secret: "change_this_to_a_secure_random_string"
  telegram_token: ""
  pushover_token: ""
  disable_signup: false

schema:
  jwt_secret: str
  telegram_token: "str?"
  pushover_token: "str?"
  disable_signup: "bool?"
